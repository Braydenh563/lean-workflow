  <text class="name" x="168" y="80" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" textLength="310" lengthAdjust="spacing">lean-workflow</text>
  <text class="tag" x="170" y="110" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" textLength="310" lengthAdjust="spacing">Fewer tokens per task. The checks stay.</text>
