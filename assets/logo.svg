<svg xmlns="http://www.w3.org/2000/svg" width="490" height="150" viewBox="0 0 490 150" role="img" aria-labelledby="t d">
  <title id="t">lean-workflow</title>
  <desc id="d">Three horizontal bars that shorten from top to bottom, with a small amber mark at the end of the shortest, beside the name lean-workflow.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      .name { fill: #0B1220; }
      .tag  { fill: #475569; }
      @media (prefers-color-scheme: dark) {
        .name { fill: #F1F5F9; }
