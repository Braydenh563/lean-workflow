    </style>
  </defs>
  <rect x="10.75" y="11.75" width="126.5" height="126.5" rx="29.5" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
  <rect x="34" y="40" width="80" height="15" rx="7.5" fill="url(#g)"/>
