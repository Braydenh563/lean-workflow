name: Tag release
# When plugin.json's version is new on main, tag the commit that set it (lean-workflow--vX.Y.Z).
on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json"]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/tag.sh --push
