name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: bash -n skills/lean-setup/templates/orient.sh && bash -n skills/lean-setup/templates/gate.sh && bash -n scripts/keep-going.sh && bash -n scripts/tag.sh
      - run: python -c "import json,glob;[json.load(open(f)) for f in glob.glob('.claude-plugin/*.json')]"
      - run: python -m py_compile scripts/item_ledger.py skills/upgrade-scan/scan.py
      - run: python -m pytest -q tests
