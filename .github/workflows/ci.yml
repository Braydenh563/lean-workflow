name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: bash -n skills/lean-setup/templates/orient.sh && bash -n skills/lean-setup/templates/gate.sh && bash -n scripts/keep-going.sh
      - run: python -c "import json,glob;[json.load(open(f)) for f in glob.glob('.claude-plugin/*.json')]"
      - run: python -m pytest -q tests
